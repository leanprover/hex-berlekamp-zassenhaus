name = "hex-berlekamp-zassenhaus-bench"
defaultTargets = ["hexbz_bench"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBerlekampZassenhaus"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "85ab4582fbe0d86bb38f5429b17b9154fede75f0"

[[require]]
name = "lean-bench"
git = "https://github.com/kim-em/lean-bench.git"
rev = "master"

[[lean_exe]]
name = "hexbz_bench"
root = "HexBerlekampZassenhaus.Bench"
