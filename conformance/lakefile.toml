name = "hex-berlekamp-zassenhaus-conformance"
defaultTargets = ["HexBerlekampZassenhausConformance", "hexbz_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBerlekampZassenhaus"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "5b3dc5d7789cb680d64f8f4046254f93b7424e4f"

[[lean_lib]]
name = "HexBerlekampZassenhausConformance"
globs = ["HexBerlekampZassenhaus.Conformance", "HexBerlekampZassenhaus.CrossCheck"]

[[lean_exe]]
name = "hexbz_emit_fixtures"
root = "HexBerlekampZassenhaus.EmitFixtures"
